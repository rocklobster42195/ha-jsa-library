<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSA Script Library</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
        <span>JSA Script Library</span>
      </div>
      <button type="button" class="btn-config" id="btnConfig" title="Configure your JSA URL">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        JSA URL
      </button>
    </div>
  </header>

  <div class="setup-banner" id="setupBanner">
    <div class="setup-banner-inner">
      <span>Enter your JSA address to enable one-click imports</span>
      <div class="setup-input-row">
        <input type="url" id="jsaUrlInput" placeholder="http://192.168.1.100:8123" />
        <button type="button" class="btn-save" id="btnSaveUrl">Save</button>
        <button type="button" class="btn-banner-close" id="btnBannerClose" title="Dismiss">✕</button>
      </div>
    </div>
  </div>

  <main>
    <div class="hero">
      <h1>JSA Script Library</h1>
      <p>Ready-to-use automations for the <a href="https://github.com/rocklobster42195/ha-js_automations_addon" target="_blank" rel="noopener noreferrer">JS Automations</a> Home Assistant addon. Browse the collection and import any script into your instance with one click.</p>
    </div>
    <div class="tag-filter" id="tagFilter"></div>
    <div class="grid" id="grid"></div>
  </main>

  <div class="modal-overlay hidden" id="configModal">
    <div class="modal">
      <h3>JSA URL</h3>
      <p>Enter the address of your JS Automations addon.</p>
      <input type="url" id="modalUrlInput" placeholder="http://192.168.1.100:8123" />
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="btnModalCancel">Cancel</button>
        <button type="button" class="btn-primary" id="btnModalSave">Save</button>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
